<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comité de Transporte Universitario UNMSM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#FFF6E5; --surface:#FFFDF8; --ink:#3A0F0C; --muted:#7A5A55; --line:#E8D9BF;
  --brand:#93120D; --brand2:#6E0D09; --onbrand:#FFF6E5; --link:#93120D;
  --ok:#2F7D4F; --okbg:#E4F2E6; --warn:#8A5A00; --warnbg:#FCEBC2; --bad:#B3261E; --badbg:#FBE1DC;
  --display:'Archivo',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C0E0D; --surface:#2A1614; --ink:#FFEFD6; --muted:#C7A9A2; --line:#4A2A27;
    --brand:#B3261E; --brand2:#93120D; --link:#FF9C90;
    --ok:#6FCF97; --okbg:#173325; --warn:#FFC857; --warnbg:#3A2C0C; --bad:#FF9C90; --badbg:#421D19;
  }
}
:root[data-theme="dark"]{
  --bg:#1C0E0D; --surface:#2A1614; --ink:#FFEFD6; --muted:#C7A9A2; --line:#4A2A27;
  --brand:#B3261E; --brand2:#93120D; --link:#FF9C90;
  --ok:#6FCF97; --okbg:#173325; --warn:#FFC857; --warnbg:#3A2C0C; --bad:#FF9C90; --badbg:#421D19;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15}
h2{font-size:22px}
h3{font-size:18px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hidden{display:none!important}
.logo{background:var(--logo) center/contain no-repeat;border-radius:50%;flex:none}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .logo{width:min(56vw,240px);aspect-ratio:1;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#splash .bar{width:min(40vw,160px);height:4px;border-radius:4px;background:rgba(255,246,229,.25);overflow:hidden}
#splash .bar i{display:block;height:100%;width:100%;background:var(--onbrand);transform-origin:left;transform:scaleX(0)}
@media (prefers-reduced-motion:no-preference){
  #splash .logo{animation:sp-in .7s cubic-bezier(.2,.8,.2,1) both}
  #splash .bar i{animation:sp-bar 1.7s ease-in-out .2s forwards}
  @keyframes sp-in{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
  @keyframes sp-bar{to{transform:scaleX(1)}}
}
@media (prefers-reduced-motion:reduce){#splash .bar i{transform:scaleX(1)}}

/* header */
.top{background:var(--brand);color:var(--onbrand);padding:12px 16px;position:relative;margin-bottom:8px}
.top .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top .logo{width:44px;height:44px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1;flex:1}
.brand small{display:block;font-family:var(--body);font-weight:600;font-size:13px;opacity:.85;letter-spacing:0}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:14px;
  background:radial-gradient(circle at 7px 0,var(--bg) 6px,transparent 6.5px) 0 0/20px 14px repeat-x}
.chip{background:rgba(255,246,229,.18);border-radius:99px;padding:4px 12px;font-weight:600;font-size:14px;white-space:nowrap}

.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
body.hasnav .wrap{padding-bottom:110px}

/* buttons, cards, forms */
.btn{border:1.5px solid var(--line);border-radius:12px;padding:13px 18px;font-weight:600;cursor:pointer;min-height:48px;background:var(--surface)}
.btn.primary{background:var(--brand);color:var(--onbrand);border-color:var(--brand);font-family:var(--display);font-weight:700}
.btn.ghost{background:transparent}
.btn.small{min-height:38px;padding:7px 14px;font-size:15px}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.chip{border:0;cursor:pointer}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .btn{flex:1 1 auto}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.tabs{display:flex;gap:6px;margin-top:18px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:5px}
.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 6px;font-weight:600;cursor:pointer;color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--brand);color:var(--onbrand)}
label{display:block;font-weight:600;font-size:15px;margin:14px 0 5px}
input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
.msg{border-radius:12px;padding:11px 14px;margin-top:14px;font-weight:600;font-size:15px}
.msg.bad{background:var(--badbg);color:var(--bad)}
.msg.ok{background:var(--okbg);color:var(--ok)}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:11px 14px;font-size:14px;margin-top:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.two{grid-template-columns:1fr}}
.intro{display:flex;align-items:center;gap:14px;margin-top:20px}
.intro .logo{width:72px;height:72px}
.intro p{margin:2px 0 0;color:var(--muted)}

/* photo picker */
.photo{display:flex;align-items:center;gap:14px;margin-top:6px}
.pv{width:84px;height:84px;border-radius:50%;border:2px dashed var(--line);background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;flex:none}
.pv.has{border-style:solid;border-color:var(--brand)}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;font-size:0}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);flex:none;border:2px solid var(--brand)}
.av.sm{width:44px;height:44px;border-width:1.5px}
.av.lg{width:104px;height:104px}
.ini{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:var(--brand)}

/* ticket */
.ticket{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;margin-top:22px;overflow:visible}
.ticket .main{padding:18px 18px 22px;display:flex;gap:14px;align-items:center;border-bottom:2px dashed var(--line);border-top:8px solid var(--brand);border-radius:16px 16px 0 0}
.ticket .who{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;line-height:1.15}
.ticket .code{font-family:var(--display);font-weight:700;font-size:17px;color:var(--link);letter-spacing:.06em;margin-top:3px}
.ticket .dni{color:var(--muted);font-size:14px}
.ticket .stub{position:relative;padding:16px 18px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line)}
.ticket .stub::before{left:-14px;clip-path:inset(0 0 0 50%)}
.ticket .stub::after{right:-14px;clip-path:inset(0 50% 0 0)}
.big{font-family:var(--display);font-weight:800;font-size:54px;line-height:1;color:var(--link)}
.lbl{color:var(--muted);font-size:14px}

.stat{display:flex;gap:10px;margin-top:18px}
.stat div{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{font-family:var(--display);font-size:28px;display:block;color:var(--link)}
.stat span{color:var(--muted);font-size:14px}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
ul.list li:last-child{border-bottom:0}
ul.list .l{display:flex;align-items:center;gap:12px;min-width:0}
ul.list .sub{color:var(--muted);font-size:14px}
ul.list .r{text-align:right;flex:none}
.empty{color:var(--muted);padding:6px 0;margin:0}

/* hero de inicio del administrador */
.hero{background:var(--brand);color:var(--onbrand);border-radius:18px;padding:20px;margin-top:20px}
.hero h2{font-size:26px}
.hero p{margin:6px 0 0;opacity:.9}
.hero .btn{background:var(--onbrand);color:var(--brand2);border-color:var(--onbrand);margin-top:16px;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px}

/* scanner */
.cam{position:relative;background:#000;border-radius:16px;overflow:hidden;aspect-ratio:4/3;margin-top:14px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .guide{position:absolute;left:10%;right:10%;top:38%;height:24%;border:3px solid var(--onbrand);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none}
.cam .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#d8c9b8;text-align:center;padding:20px}
.status{color:var(--muted);font-size:14px;margin-top:8px;min-height:20px}
.res{border-radius:16px;padding:16px 18px;margin-top:16px;border:1.5px solid var(--line)}
.res.ok{background:var(--okbg);border-color:var(--ok)}
.res.warn{background:var(--warnbg);border-color:var(--warn)}
.res.bad{background:var(--badbg);border-color:var(--bad)}
.res .top2{display:flex;gap:14px;align-items:center}
.res .rname{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.15}
.res .rcode{font-family:var(--display);font-weight:700;letter-spacing:.06em;color:var(--muted)}
.res p{margin:10px 0 0}
.inline{display:flex;gap:10px}
.inline input{flex:1}
@media (prefers-reduced-motion:no-preference){.res{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.98);opacity:.4}to{transform:none;opacity:1}}}

.av.md{width:56px;height:56px}
.st{border-radius:99px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.wait{background:var(--warnbg);color:var(--warn)}
.mxw{overflow-x:auto;margin-top:10px}
.mx{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
.mx th,.mx td{padding:8px 4px;border-bottom:1px solid var(--line)}
.mx thead th{font-size:12px;color:var(--muted);font-weight:600;vertical-align:bottom}
.mx tbody th{text-align:left;font-family:var(--display)}
.mx td{font-variant-numeric:tabular-nums}
.mx td.full{color:var(--bad);font-weight:700}
/* opciones (rutas, turnos, rol) */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{position:relative;display:block;margin:0;font-weight:600}
.opt input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;cursor:pointer;margin:0;padding:0}
.opt span{display:block;padding:9px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);min-height:44px;line-height:1.7}
.opt input:checked + span{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.opt input:focus-visible + span{outline:3px solid var(--brand);outline-offset:2px}
.tag{display:inline-block;background:var(--bg);border:1.5px solid var(--line);color:var(--link);border-radius:99px;padding:2px 12px;font-weight:700;font-size:14px;margin-top:8px}
.nbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-top:8px;max-height:230px;overflow-y:auto;padding:2px}
.nb{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer}
.nb.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.nb:disabled{background:var(--bg);color:var(--muted);opacity:.45;cursor:not-allowed;text-decoration:line-through}
.nb:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.qbar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--brand)}
.stat.four b{font-size:24px}

/* menú inferior */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav .in{max-width:520px;margin:0 auto;display:flex;align-items:stretch;padding:6px 8px}
#nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;min-height:58px;border-radius:12px;text-align:center;line-height:1.15}
#nav button.prim{flex:1.5}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--link)}
#nav .ic{display:flex;align-items:center;justify-content:center;padding:3px 10px;border-radius:14px}
#nav button.prim .ic{background:var(--brand);color:var(--onbrand);padding:5px 14px}
#nav button.prim[aria-current="page"]{color:var(--link)}

/* boleto del alumno */
.protected{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.protected img{pointer-events:none;-webkit-user-drag:none}
@media print{.protected{display:none!important}body::before{content:"Impresión no permitida";display:block;padding:40px;font-size:24px}}
.tk-wrap{position:relative;margin-top:22px}
.tk{display:grid;grid-template-columns:1fr 32%;grid-template-rows:auto 1fr auto;background:#F2E4C4;color:#8B1A12;border-radius:14px;overflow:hidden;font-family:var(--display)}
.tk-h{grid-column:1/-1;background:#8B1A12;color:#FFF6E5;font-weight:800;font-size:clamp(11px,3.4vw,15px);padding:11px 16px;border-bottom:1.5px solid #C9A98A}
.tk-l{grid-column:1;grid-row:2;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px}
.tk-l i{flex:1;height:1.5px;background:#8B1A12;position:relative}
.tk-st{width:min(30vw,130px);aspect-ratio:1;border-radius:50%;flex:none;object-fit:cover}
.tk-f{grid-column:1;grid-row:3;background:#8B1A12;color:#FFF6E5;font-weight:800;font-size:clamp(9px,2.8vw,12px);text-align:center;padding:9px 6px}
.tk-r{grid-column:2;grid-row:2/4;border-left:1.5px dotted #8B1A12;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px}
.tk-r small{font-weight:800;font-size:12px}
.tk-r b{font-size:clamp(30px,10vw,44px);line-height:1;border-bottom:1.5px solid #8B1A12;padding:0 8px 6px;margin-bottom:8px}
.tk-dk{width:70%;max-width:96px}
.tk-id{display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}
.tk-id .who{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15}
.tk-id .sub{color:var(--muted);font-size:14px}
.tk-live{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;padding:9px 14px;border-radius:12px;background:var(--okbg);color:var(--ok);font-weight:700;font-size:14px;position:relative;overflow:hidden}
.tk-live::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:tk-sweep 2.2s linear infinite}
@keyframes tk-sweep{to{transform:translateX(100%)}}
.tk-clock{font-variant-numeric:tabular-nums;font-size:17px}
.tk-wm{position:absolute;inset:0;pointer-events:none;border-radius:14px}
.tk-msg{display:none;padding:40px 16px;text-align:center;font-weight:700;background:var(--surface);border:1.5px solid var(--line);border-radius:14px}
body.shield .tk-in{display:none}
body.shield .tk-msg{display:block}
.welcome .wrow{display:flex;align-items:center;gap:16px}
.welcome .wl{margin:0;font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:15px;opacity:.9}
.welcome h2{font-size:24px;margin-top:2px;word-break:break-word}
.hero .av{border-color:var(--onbrand)}
.hero .av.lg{width:84px;height:84px}

/* reportes de acoso */
textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:140px;resize:vertical;line-height:1.45}
.rp-img{display:block;max-width:100%;max-height:340px;border-radius:12px;border:1.5px solid var(--line);margin-top:10px}
.rp-t{white-space:pre-wrap;word-break:break-word;margin:10px 0 0}
.rp-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
#rp_pv .btn{margin-top:8px}
#nav button{min-width:0}
#nav .in.n6 button{font-size:11px;padding:6px 0}
#nav .in.n6 button.prim{flex:1.2}

/* baneos */
select{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;font:inherit;color:inherit}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.bantag{color:var(--bad);font-weight:600;font-size:14px}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto}
@media (min-width:560px){.modal{align-items:center}.sheet{border-radius:20px}}
.bcard{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}

/* modo sin conexión */
.offbar{background:var(--warnbg);color:var(--warn);font-weight:700;font-size:14px;text-align:center;padding:8px 14px;border-bottom:1.5px solid var(--line)}
.offnote{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;margin-top:14px;font-weight:600;font-size:14px}
</style>
</head>
<body>

<div id="splash" role="img" aria-label="Comité de Transporte Universitario UNMSM"><div class="logo"></div><div class="bar"><i></i></div></div>

<header class="top"><div class="in"><div class="logo" aria-hidden="true"></div>
  <div class="brand">Comité de Transporte<small>Universitario UNMSM</small></div><div id="who"></div></div></header>
<div id="offbar" class="offbar" role="status" hidden></div>
<main class="wrap" id="app"></main>
<nav id="nav" class="hidden" aria-label="Menú principal"></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, setPersistence, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, deleteUser, updateEmail, reauthenticateWithCredential, EmailAuthProvider, RecaptchaVerifier, linkWithPhoneNumber, signInWithPhoneNumber, unlink, updatePassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, onSnapshot, getDocs, writeBatch, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
/* PEGA AQUÍ la configuración de tu app web de Firebase (Configuración del proyecto > Tus apps) */
const firebaseConfig = {
  apiKey: "AIzaSyB4O0_uspJ8KypsA1pla04aEDg-fhQ0qbI",
  authDomain: "app-ctu.firebaseapp.com",
  projectId: "app-ctu",
  storageBucket: "app-ctu.firebasestorage.app",
  messagingSenderId: "777604792750",
  appId: "1:777604792750:web:6b9d581f25f3a3346a883f"
};
const ok = !firebaseConfig.apiKey.startsWith("PEGA");
const app = initializeApp(ok ? firebaseConfig : { apiKey: "x", projectId: "x", appId: "x" });
// Caché local de Firestore: con ella la app puede leer perfil y boletos ya descargados aunque no haya internet
let fdb; try{ fdb = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }catch(e){ fdb = getFirestore(app); }
// Sesión persistente: se guarda en el dispositivo (IndexedDB, y localStorage como respaldo) hasta que el alumno cierre sesión
let fauth; try{ fauth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] }); }catch(e){ fauth = getAuth(app); }
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}   // pide al navegador no borrar los datos de la app
window.FB = { ok, auth: fauth, setPersistence, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, db: fdb, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, deleteUser, updateEmail, reauthenticateWithCredential, EmailAuthProvider, RecaptchaVerifier, linkWithPhoneNumber, signInWithPhoneNumber, unlink, updatePassword, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, limit, onSnapshot, getDocs, writeBatch, runTransaction };
window.dispatchEvent(new Event("fb-ready"));

/* Base de datos del prototipo: usuarios (alumnos y administradores) y boletos entregados */
let DB = { users: [], tickets: [], transport: {}, reports: [], bans: {}, virtual: {}, slots: {}, queue: {}, session: null };

/* ---------- boleto sin internet ---------- */
// Cada vez que llegan datos del servidor, el alumno guarda en su celular una copia de su boleto de hoy.
// Si luego no tiene internet, la app muestra esa copia. Se borra al cerrar sesión.
const OFFKEY = 'comite_boleto_offline_v1';
let ticketsReady = false, lastOff = '', offlineMode = false;
function loadOffline(){ try{ const d = JSON.parse(localStorage.getItem(OFFKEY)); return d && d.user && d.user.id ? d : null; }catch(_){ return null; } }
const CREDKEY = 'comite_cred_offline_v1';
function clearOffline(){ lastOff = ''; try{ localStorage.removeItem(OFFKEY); localStorage.removeItem(CREDKEY); }catch(_){} }
// Al ingresar con internet se guarda una huella (PBKDF2 + sal) de código y contraseña, solo para poder
// verificarlos sin conexión. No se guarda la contraseña en texto. Se borra al cerrar sesión.
async function derive(code, pw, salt){
  const k = await crypto.subtle.importKey('raw', new TextEncoder().encode(code + ':' + pw), 'PBKDF2', false, ['deriveBits']);
  const b = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, k, 256);
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
async function saveCred(code, pw){
  try{
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const h = await derive(code, pw, salt);
    localStorage.setItem(CREDKEY, JSON.stringify({ code, salt: [...salt], h }));
  }catch(_){}
}
async function checkCred(code, pw){
  try{
    const c = JSON.parse(localStorage.getItem(CREDKEY)); if(!c || c.code !== code) return false;
    return (await derive(code, pw, new Uint8Array(c.salt))) === c.h;
  }catch(_){ return false; }
}
function saveOffline(){
  const me = cur(); if(!me || me.role !== 'student' || !ticketsReady) return;
  const day = dayKey(Date.now());
  const body = {
    day,
    user: { id: me.id, role: me.role, nombres: me.nombres, apellidos: me.apellidos, code: me.code, dni: me.dni, ruta: me.ruta, foto: me.foto || null },
    tickets: DB.tickets.filter(t => t.code === me.code && dayKey(t.ts) === day),
    orders: queueNumbersForUser(me, day),
    ban: DB.bans[me.id] || null
  };
  const k = JSON.stringify(body); if(k === lastOff) return;
  lastOff = k;
  try{ localStorage.setItem(OFFKEY, JSON.stringify({ ...body, savedAt: Date.now() })); }catch(_){}
}
function syncOffbar(){
  const b = $('#offbar'); if(!b) return;
  const off = navigator.onLine === false, me = cur();
  b.hidden = !off;
  b.textContent = me && me.role === 'admin' ? 'Sin conexión a internet. Algunas funciones no estarán disponibles hasta que vuelvas a conectarte.' : 'Sin conexión a internet. Tu boleto guardado sigue disponible.';
}
window.addEventListener('offline', syncOffbar);
window.addEventListener('online', () => {
  syncOffbar();

async function virtualClaim(turno){
  const me = cur(); if(!me || me.role !== 'student' || claiming) return;
  const ruta = me.ruta, day = dayKey(Date.now());
  const done = (t, m) => { vNote = { t, m }; claiming = false; render(); };
  if(!ruta || !turnosDe(ruta).includes(turno)) return;
  if(banOf(me.id)){ render(); return; }
  if(navigator.onLine === false) return done('bad', 'Sin conexión. Necesitas internet para sacar tu boleto virtual.');
  const cfg = virtGet(ruta, turno);
  if(!cfg || !cfg.enabled) return done('bad', 'El delegado todavía no habilitó la entrega virtual en este turno.');
  if(Date.now() < cfg.from) return done('bad', 'La entrega virtual se abre a las ' + fromTxt(cfg) + '.');
  if(DB.tickets.some(t => t.code === me.code && dayKey(t.ts) === day && t.turno === turno)) return done('bad', 'Ya tienes un boleto en este turno.');
  const existingQueue = queueForUser(me, turno, day);
  if(existingQueue) return done('ok', `Ya estás en la lista de orden con el N° ${String(queueNumber(existingQueue)).padStart(2,'0')}.`);
  let start = slotFirst(ruta, turno);
  claiming = true; vNote = null; render();
  try{
    if(!start){
      const qid = `${day}_${ruta}_${turno}_${me.id}`;
      const qref = FB.doc(FB.db, 'queue', qid);
      const q = { uid: me.id, code: me.code, name: full(me), day, ruta, turno, ts: Date.now(), byUid: me.id, source: 'virtual' };
      await FB.setDoc(qref, q);
      DB.queue[qid] = q;
      const order = queueNumber(q);
      done('ok', `Los 50 boletos ya fueron ocupados. Tu número de orden es el N° ${String(order).padStart(2,'0')}.`);
      return;
    }
    const res = await FB.runTransaction(FB.db, async tx => {
      let num = null, slotRef = null;
      for(let n = start; n <= LIMIT; n++){
        const ref = FB.doc(FB.db, 'slots', `${day}_${ruta}_${turno}_${n}`);
        const snap = await tx.get(ref);
        if(!snap.exists()){ num = n; slotRef = ref; break; }
      }
      if(!num) return null;
      const ts = Date.now(), id = slotRef.id;
      const ticket = { id, num, uid: me.id, code: me.code, name: full(me), ts, day, by: 'Entrega virtual', byUid: me.id, ruta, turno, virtual: true };
      tx.set(FB.doc(FB.db, 'ticketClaims', `${day}_${turno}_${me.id}`), { uid: me.id, code: me.code, ticketId: id, day, ruta, turno, byUid: me.id, ts });
      tx.set(FB.doc(FB.db, 'tickets', id), ticket);
      tx.set(slotRef, { day, ruta, turno, num });
      return ticket;
    });
    if(!res){
      const qid = `${day}_${ruta}_${turno}_${me.id}`;
      const qref = FB.doc(FB.db, 'queue', qid);
      const q = { uid: me.id, code: me.code, name: full(me), day, ruta, turno, ts: Date.now(), byUid: me.id, source: 'virtual' };
      await FB.setDoc(qref, q);
      DB.queue[qid] = q;
      const order = queueNumber(q);
      done('ok', `Los 50 boletos ya fueron ocupados. Tu número de orden es el N° ${String(order).padStart(2,'0')}.`);
      return;
    }
    DB.tickets = DB.tickets.filter(x => x.id !== res.id); DB.tickets.unshift(res);
    DB.slots[res.id] = { day, ruta, turno, num: res.num };
    done('ok', `Listo. Tu boleto es el N° ${String(res.num).padStart(2, '0')} de la ruta ${ruta}, turno ${turno}. Míralo en "Mi boleto".`);
  }catch(e){
    console.error(e);
    done('bad', 'No se pudo registrar la solicitud. Inténtalo nuevamente.');
  }
}

async function saveProfile(f){
  const me = cur(), el = f.elements; if(!me) return;
  const nombres = el.pf_nom.value.trim().replace(/\s+/g, ' '), apellidos = el.pf_ape.value.trim().replace(/\s+/g, ' ');
  const dni = el.pf_dni.value.replace(/\s/g, ''), code = norm(el.pf_cod.value), pw = el.pf_pw.value;
  const codeChanged = code !== me.code;
  let err = '';
  if(nombres.length < 2 || apellidos.length < 2) err = 'Escribe tus nombres y apellidos completos.';
  else if(!/^\d{8}$/.test(dni)) err = 'El DNI debe tener exactamente 8 números.';
  else if(code.length < 6 || code.length > 10) err = 'El código de estudiante debe tener entre 6 y 10 caracteres.';
  else if(codeChanged && !pw) err = 'Escribe tu contraseña actual para cambiar el código de estudiante.';
  if(err){ setMsg(f, 'bad', err); return; }
  const patch = {};
  if(nombres !== me.nombres) patch.nombres = nombres;
  if(apellidos !== me.apellidos) patch.apellidos = apellidos;
  if(dni !== me.dni) patch.dni = dni;
  if(codeChanged) patch.code = code;
  if(!Object.keys(patch).length){ setMsg(f, 'bad', 'No hay cambios para guardar.'); return; }
  const btn = f.querySelector('button[type="submit"]'); btn.disabled = true;
  const user = FB.auth.currentUser; let stage = 'auth', emailChanged = false;
  try{
    if(codeChanged){
      // cambiar el código = cambiar el correo interno de la cuenta; Firebase pide confirmar la contraseña
      await FB.reauthenticateWithCredential(user, FB.EmailAuthProvider.credential(mail(me.code), pw));
      await FB.updateEmail(user, mail(code)); emailChanged = true;
      await user.getIdToken(true);
    }
    stage = 'users';
    for(let tries = 0; ; tries++){
      try{ await FB.updateDoc(FB.doc(FB.db, 'users', me.id), patch); break; }
      catch(ex){ if(!codeChanged || !String(ex.code).includes('permission-denied') || tries >= 2) throw ex; await new Promise(r => setTimeout(r, 900)); }
    }
    stage = 'delegates';
    if(me.role === 'admin' && (patch.nombres || patch.apellidos)){
      const dp = {}; if(patch.nombres) dp.nombres = nombres; if(patch.apellidos) dp.apellidos = apellidos;
      await FB.updateDoc(FB.doc(FB.db, 'delegates', me.id), dp);
    }
  }catch(ex){
    if(emailChanged && stage === 'users'){ try{ await FB.updateEmail(user, mail(me.code)); await user.getIdToken(true); }catch(_){} }
    const c = ex.code || '';
    setMsg(f, 'bad', c === 'auth/email-already-in-use' ? 'Ese código de estudiante ya pertenece a otra cuenta.'
      : (c === 'auth/invalid-credential' || c === 'auth/wrong-password') ? 'La contraseña actual no es correcta.'
      : c === 'auth/operation-not-allowed' ? 'Cambiar el código no está habilitado en Firebase todavía. Avisa al comité.'
      : c === 'auth/too-many-requests' ? 'Demasiados intentos. Espera unos minutos e inténtalo otra vez.'
      : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
    btn.disabled = false; return;
  }
  profNote = { t: 'ok', m: codeChanged ? 'Datos guardados. Desde ahora ingresas con tu nuevo código.' : 'Datos guardados.' };
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  softRender();
}

async function processReportPhoto(file){
  const src = await decodeImage(file);
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  if(!w || !h) throw new Error('decode');
  const k = Math.min(1, 1280 / Math.max(w, h)), c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.drawImage(src, 0, 0, c.width, c.height);
  if(src.close) try{ src.close(); }catch(_){}
  let q = 0.75, d = c.toDataURL('image/jpeg', q);
  while(d.length > 650000 && q > 0.35){ q -= 0.1; d = c.toDataURL('image/jpeg', q); }
  if(d.length > 650000) throw new Error('big');
  return d;
}

/* ---------- foto ---------- */
// Carga cualquier imagen del celular de forma robusta: fotos enormes (cámaras de 50 MP),
// formatos raros (HEIC/HEIF de iPhone, AVIF, WebP) y orientación EXIF.
const isHeic = f => /hei[cf]/i.test(f.type || '') || /\.hei[cf]$/i.test(f.name || '');
function loadHeicLib(){
  if(window.heic2any) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
    sc.onload = res; sc.onerror = () => rej(new Error('heic-lib')); document.head.appendChild(sc);
  });
}
function imgFromBlob(blob){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('decode')); };
    im.src = url;
  });
}
async function decodeImage(file){
  // 1) createImageBitmap (rápido y con poca memoria)
  if(window.createImageBitmap){
    try{ return await createImageBitmap(file, { imageOrientation: 'from-image' }); }catch(_){}
    try{ return await createImageBitmap(file); }catch(_){}
  }
  // 2) <img> con URL temporal (no convierte la foto a base64 gigante)
  try{ return await imgFromBlob(file); }catch(_){}
  // 3) HEIC/HEIF (iPhone): se convierte a JPEG y se reintenta
  if(isHeic(file)){
    await loadHeicLib();
    let out = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.85 });
    if(Array.isArray(out)) out = out[0];
    return await imgFromBlob(out);
  }
  throw new Error('decode');
}
async function processPhoto(file){
  const src = await decodeImage(file);
  const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
  if(!w || !h) throw new Error('decode');
  const s = Math.min(w, h), c = document.createElement('canvas'), ctx = c.getContext('2d');
  c.width = c.height = 256;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 256, 256); // los PNG con fondo transparente no quedan negros
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 256, 256);
  if(src.close) try{ src.close(); }catch(_){}
  const d = c.toDataURL('image/jpeg', 0.82);
  if(!d || d.length < 200) throw new Error('empty');
  return d;
}

function phoneNorm(v){ v = String(v || '').replace(/[\s\-().]/g, ''); if(!v) return ''; if(v[0] !== '+') v = '+51' + v.replace(/^0+/, ''); return /^\+\d{8,15}$/.test(v) ? v : ''; }

    const vv = $('#virt'); if(vv) vv.innerHTML = virtAdminHTML();
    if(pendingCode && paused) showResult();
  }
  else if(a === 'trruta'){ trRuta = b.dataset.v; if(!turnosDe(trRuta).includes(trTurno)) trTurno = ''; render(); }
  else if(a === 'trturno'){ trTurno = b.dataset.v; render(); }
  else if(a === 'trllego'){ const me = cur(); if(me && trRuta && trTurno){ FB.setDoc(FB.doc(FB.db, 'transport', trKey(trRuta, trTurno)), { ts: Date.now(), by: full(me) }).catch(fail); } }
  else if(a === 'trreset'){ FB.deleteDoc(FB.doc(FB.db, 'transport', trKey(trRuta, trTurno))).catch(fail); }
  else if(a === 'cam-start') startScan();
  else if(a === 'cam-stop'){ stopScan(); setStatus('Cámara apagada.'); }
  else if(a === 'manual'){ const v = $('#manual').value; if(v.trim()) handleCode(v); }
  else if(a === 'deluser') delUser(b.dataset.id);
  else if(a === 'delticket') deleteTicket(b.dataset.id);
  else if(a === 'virt') setVirtual(b.dataset.v === 'on');
  else if(a === 'vclaim') virtualClaim(b.dataset.t);
  else if(a === 'pick'){ pickNum = Number(b.dataset.v); const np = $('#numpick'); if(np) np.innerHTML = numPickHTML(); }
  else if(a === 'deliver') deliver(b.dataset.code);
  else if(a === 'again') resume();
  else if(a === 'banopen') openBan(b.dataset.id);
  else if(a === 'banclose') closeBan();
  else if(a === 'banpreset'){ const fm = b.closest('form'); if(fm){ fm.elements.bn_n.value = b.dataset.n; fm.elements.bn_u.value = b.dataset.u; } }
  else if(a === 'unban') unban(b.dataset.id);
});

async function completeProfile(f){
  const fu = FB.auth.currentUser; if(!fu || !orphanUser) return;
  const el = f.elements;
  const rol = (f.querySelector('input[name="rg_rol"]:checked') || {}).value || 'student';
  const ruta = (f.querySelector('input[name="rg_ruta"]:checked') || {}).value || '';
  const turnos = [...f.querySelectorAll('input[name="rg_turno"]:checked')].map(i => i.value);
  const nombres = el.rg_nom.value.trim().replace(/\s+/g, ' '), apellidos = el.rg_ape.value.trim().replace(/\s+/g, ' ');
  const dni = el.rg_dni.value.replace(/\s/g, ''), code = norm((fu.email || '').split('@')[0]);
  let err = '';
  if(!pendingPhoto) err = 'Sube tu foto de perfil para continuar.';
  else if(nombres.length < 2 || apellidos.length < 2) err = 'Escribe tus nombres y apellidos completos.';
  else if(!/^\d{8}$/.test(dni)) err = 'El DNI debe tener exactamente 8 números.';
  else if(code.length < 6 || code.length > 10) err = 'No se pudo leer el código de tu cuenta. Cierra sesión e inténtalo de nuevo.';
  else if(!ruta) err = 'Elige la ruta a la que perteneces.';
  else if(rol === 'admin' && !turnos.length) err = 'Marca al menos un turno en el que eres delegado.';
  else if(rol === 'admin' && !norm(el.rg_key.value)) err = 'Escribe la clave de delegado.';
  if(err){ setMsg(f, 'bad', err); return; }
  const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; registering = true;
  let wrote = false;
  try{
    if(rol === 'admin') await withTimeout(FB.setDoc(FB.doc(FB.db, 'adminRequests', fu.uid), { key: norm(el.rg_key.value) }));
    wrote = true;
    await withTimeout(FB.setDoc(FB.doc(FB.db, 'users', fu.uid), { role: rol, code, dni, nombres, apellidos, foto: pendingPhoto, ruta, turnos: rol === 'admin' ? turnos : [], createdAt: Date.now() }));
    if(rol === 'admin') await withTimeout(FB.setDoc(FB.doc(FB.db, 'delegates', fu.uid), { role: 'admin', nombres, apellidos, foto: pendingPhoto, ruta, turnos }));
    pendingPhoto = null;
  }catch(ex){
    const c = ex.code || '';
    registering = false; btn.disabled = false;
    const denied = c.includes('permission-denied');
    if(!wrote){
      setMsg(f, 'bad', denied ? 'La clave de delegado no es correcta.' : 'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');
      return;
    }
    // el perfil pudo quedar a medias: se cierra la sesión y al volver a ingresar se reintenta
    authNotice = denied ? 'No se pudo guardar tu perfil. Si un administrador eliminó tu cuenta, comunícate con el comité.'
      : 'No se pudo guardar tu perfil por la conexión. Ingresa de nuevo con tu código y contraseña para completarlo.';
    authMode = 'login'; orphanUser = null; pendingPhoto = null;
    try{ await FB.signOut(FB.auth); }catch(_){}
    render(); return;
  }
  registering = false; btn.disabled = false;
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, el = f.elements;
  if(kind === 'profile'){ await saveProfile(f); return; }
  if(kind === 'report'){ await sendReport(f); return; }
  if(kind === 'ban'){ await sendBan(f); return; }
  if(kind === 'complete'){ await completeProfile(f); return; }
  if(kind === 'rec_phone'){ await recLinkSend(f); return; }
  if(kind === 'rec_code'){ await recLinkVerify(f); return; }
  if(kind === 'rcv_phone'){ await rcvSend(f); return; }
  if(kind === 'rcv_code'){ await rcvVerify(f); return; }
  if(kind === 'rcv_pw'){ await rcvNewPw(f); return; }
  if(kind === 'login'){
    authNotice = '';
    const code = norm(el.lg_id.value);
    const pw = el.lg_pw.value;
    const keep = !el.lg_keep || el.lg_keep.checked;
    try{ await FB.setPersistence(FB.auth, keep ? FB.indexedDBLocalPersistence : FB.browserSessionPersistence); }
    catch(_){ try{ if(keep) await FB.setPersistence(FB.auth, FB.browserLocalPersistence); }catch(__){} }
    // Sin conexión: se verifica contra la huella guardada y se muestra el boleto guardado
    const offlineLogin = async () => {
      const d = loadOffline();
      if(!d || d.user.code !== code){ setMsg(f, 'bad', 'Sin conexión a internet. Para ingresar por primera vez en este celular necesitas conexión; después podrás ver tu boleto sin internet.'); return; }
      if(!(await checkCred(code, pw))){ setMsg(f, 'bad', 'Código o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.'); return; }
      showOfflineTicket();
    };
    if(navigator.onLine === false){ await offlineLogin(); return; }
    try{
      await withTimeout(FB.signInWithEmailAndPassword(FB.auth, mail(code), pw), 15000);
      saveCred(code, pw);
    }catch(ex){
      const c = ex && ex.code;
      if(c === 'auth/network-request-failed' || c === 'timeout' || c === 'auth/internal-error' || navigator.onLine === false){ await offlineLogin(); }
      else if(c === 'auth/too-many-requests'){ setMsg(f, 'bad', 'Demasiados intentos. Espera unos minutos e inténtalo de nuevo.'); }
      else if(c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/user-not-found' || c === 'auth/invalid-email' || c === 'auth/user-disabled'){ setMsg(f, 'bad', 'Código o contraseña incorrectos. Revisa los datos e inténtalo de nuevo.'); }
      else { setMsg(f, 'bad', 'No se pudo ingresar por un problema de conexión. Inténtalo de nuevo.'); }
    }
  }
  else if(kind === 'register'){
    const rol = (f.querySelector('input[name="rg_rol"]:checked') || {}).value || 'student';
    const ruta = (f.querySelector('input[name="rg_ruta"]:checked') || {}).value || '';
    const turnos = [...f.querySelectorAll('input[name="rg_turno"]:checked')].map(i => i.value);
    const nombres = el.rg_nom.value.trim().replace(/\s+/g, ' '), apellidos = el.rg_ape.value.trim().replace(/\s+/g, ' ');
    const dni = el.rg_dni.value.replace(/\s/g, ''), code = norm(el.rg_cod.value);
    let err = '';
    if(!pendingPhoto) err = 'Sube tu foto de perfil para continuar.';
    else if(nombres.length < 2 || apellidos.length < 2) err = 'Escribe tus nombres y apellidos completos.';
    else if(!/^\d{8}$/.test(dni)) err = 'El DNI debe tener exactamente 8 números.';
    else if(code.length < 6 || code.length > 10) err = 'El código de estudiante debe tener entre 6 y 10 caracteres.';
    else if(!ruta) err = 'Elige la ruta a la que perteneces.';
    else if(rol === 'admin' && !turnos.length) err = 'Marca al menos un turno en el que eres delegado.';
    else if(rol === 'admin' && !norm(el.rg_key.value)) err = 'Escribe la clave de delegado.';
    else if(el.rg_pw1.value.length < 6) err = 'La contraseña debe tener al menos 6 caracteres.';
    else if(el.rg_pw1.value !== el.rg_pw2.value) err = 'Las contraseñas no coinciden.';
    if(err){ setMsg(f, 'bad', err); return; }
    const btn = f.querySelector('button[type="submit"]'); btn.disabled = true; registering = true;
    let cred = null;
    try{
      cred = await FB.createUserWithEmailAndPassword(FB.auth, mail(code), el.rg_pw1.value);
      const id = cred.user.uid;
      if(rol === 'admin') await withTimeout(FB.setDoc(FB.doc(FB.db, 'adminRequests', id), { key: norm(el.rg_key.value) }));
      await withTimeout(FB.setDoc(FB.doc(FB.db, 'users', id), { role: rol, code, dni, nombres, apellidos, foto: pendingPhoto, ruta, turnos: rol === 'admin' ? turnos : [], createdAt: Date.now() }));
      if(rol === 'admin') await withTimeout(FB.setDoc(FB.doc(FB.db, 'delegates', id), { role: 'admin', nombres, apellidos, foto: pendingPhoto, ruta, turnos }));
      pendingPhoto = null;
    }catch(ex){
      const c = ex.code || '';
      if(cred && !c.includes('permission-denied')){
        // La cuenta se creó pero no se guardó el perfil (casi siempre por la conexión): NO se borra,
        // al ingresar de nuevo la app le pide completar su perfil.
        authNotice = 'Tu cuenta se creó, pero no se pudo guardar tu perfil. Ingresa con tu código y contraseña para completarlo.';
        authMode = 'login'; pendingPhoto = null; registering = false; btn.disabled = false;
        try{ await FB.signOut(FB.auth); }catch(_){}
        render(); return;
      }
      if(cred){ try{ await FB.deleteUser(cred.user); }catch(_){} }
      setMsg(f, 'bad', c === 'auth/email-already-in-use' ? 'Ese código de estudiante ya tiene una cuenta. Ingresa desde la pestaña Ingresar.'
        : c.includes('permission-denied') ? (rol === 'admin' ? 'La clave de delegado no es correcta.' : 'No se pudo crear la cuenta.')
        : 'No se pudo crear la cuenta. Revisa tu conexión e inténtalo de nuevo.');
    }
    registering = false; btn.disabled = false;
  }
});

async function startScan(){
  stopScan(); paused = false;
  const video = $('#video');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('Este navegador no permite usar la cámara. Escribe el código a mano.'); return;
  }
  try{
    if('BarcodeDetector' in window){
      try{ detector = new BarcodeDetector({ formats: ['code_39','code_128','ean_13','ean_8','itf','codabar','upc_a','qr_code'] }); }
      catch(e){ detector = null; }
    }
    if(detector){
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      video.srcObject = stream; await video.play();
      timer = setInterval(async () => {
        if(paused || video.readyState < 2) return;
        try{ const r = await detector.detect(video); if(r.length) handleCode(r[0].rawValue); }catch(e){}
      }, 200);
    } else if(window.ZXing){
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_128, ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.ITF, ZXing.BarcodeFormat.CODABAR]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      reader = new ZXing.BrowserMultiFormatReader(hints, 250);
      await reader.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false }, video, res => {
        if(res && !paused) handleCode(res.getText());
      });
    } else { setStatus('No se pudo cargar el lector. Escribe el código a mano.'); return; }
    camUI(true); setStatus('Apunta al código de barras del carnet, en horizontal.');
  }catch(err){
    stopScan();
    setStatus('No se pudo abrir la cámara. Revisa el permiso del navegador o escribe el código a mano.');
  }
}

function stopScan(){
  if(timer){ clearInterval(timer); timer = null; }
  if(reader){ try{ reader.reset(); }catch(e){} reader = null; }
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  const v = document.getElementById('video'); if(v){ try{ v.srcObject = null; }catch(e){} }
  detector = null; camUI(false);
}

// Búsqueda directa en Firestore por código (no depende de que la lista completa de usuarios ya haya terminado de cargar)
async function fetchUserByCode(code){
  try{
    const cands = [code];
    if(code.length > 8){ for(let i = 0; i + 8 <= code.length && cands.length < 30; i++){ const c = code.slice(i, i + 8); if(!cands.includes(c)) cands.push(c); } }
    const snap = await FB.getDocs(FB.query(FB.collection(FB.db, 'users'), FB.where('code', 'in', cands), FB.limit(5)));
    const list = mapDocs(snap);
    return list.find(x => x.code === code) || list[0] || null;
  }catch(e){ console.error(e); return 'err'; }
}
async function handleCode(raw){
  if(paused) return;
  const code = norm(raw); if(!code) return;
  if(!scanRoute || !scanTurno){ setStatus('Elige primero la ruta y el turno para los que entregas el boleto.'); return; }
  paused = true;
  try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
  const me = cur(), okU = x => x.role === 'student' || (me && x.id === me.id);   // alumnos, o el propio delegado
  let u = DB.users.find(x => okU(x) && x.code === code);
  if(!u) u = DB.users.find(x => okU(x) && x.code.length >= 6 && code.includes(x.code));
  let other = !u && DB.users.find(x => x.role === 'admin' && (!me || x.id !== me.id) && (x.code === code || (x.code.length >= 6 && code.includes(x.code))));
  if(!u && !other){
    setStatus('Buscando al alumno...');
    const f = await fetchUserByCode(code);
    if(!$('#result')){ paused = false; return; }   // el delegado salió de la pantalla mientras se buscaba
    setStatus('');
    if(f === 'err'){
      $('#result').innerHTML = `<div class="res bad"><div class="rname">No se pudo buscar</div><div class="rcode">${esc(code)}</div>
      <p>Revisa tu conexión e inténtalo de nuevo.</p><div class="row"><button class="btn primary" data-act="again">Reintentar</button></div></div>`;
      return;
    }
    if(f){ if(!DB.users.some(x => x.id === f.id)) DB.users.push(f); if(okU(f)) u = f; else other = f; }
  }
  pendingCode = u ? u.code : null; pickNum = null;
  showResult(u ? null : code, other || null);
}

function showResult(unknownCode, other){
  const box = $('#result'); if(!box) return;
  if(unknownCode){
    box.innerHTML = other
      ? `<div class="res bad"><div class="rname">${esc(full(other))}</div><div class="rcode">${esc(other.code)}</div>
      <p>Este carnet es de otro delegado. Cada delegado escanea su propio carnet para recibir su boleto.</p>
      <div class="row"><button class="btn primary" data-act="again">Escanear otro carnet</button></div></div>`
      : `<div class="res bad"><div class="rname">Sin cuenta</div><div class="rcode">${esc(unknownCode)}</div>
      <p>Este código todavía no tiene perfil. Pide al alumno que se registre con su código de estudiante. Si dice que ya creó su cuenta, que ingrese a la app con su código y contraseña: se le pedirá completar su perfil.</p>
      <div class="row"><button class="btn primary" data-act="again">Escanear otro carnet</button></div></div>`;
    return;
  }
  const me = cur(), u = DB.users.find(x => (x.role === 'student' || (me && x.id === me.id)) && x.code === pendingCode); if(!u) return;
  const bn = banOf(u.id);
  if(bn){
    box.innerHTML = `<div class="res bad"><div class="top2">${avatar(u)}<div><div class="rname">${esc(full(u))}</div><div class="rcode">${esc(u.code)}</div></div></div>
      <p><b>Usuario baneado hasta ${fmt(bn.until)}.</b> No se le puede entregar boleto.</p><p>Motivo: ${esc(bn.reason)}</p>
      <div class="row"><button class="btn primary" data-act="again">Entendido</button></div></div>`;
    return;
  }
  if(cntRT(scanRoute, scanTurno) >= LIMIT){
    box.innerHTML = `<div class="res bad"><div class="rname">Límite alcanzado</div>
      <p>Ya se entregaron ${LIMIT} boletos hoy para la ruta ${esc(scanRoute)} en el turno ${esc(scanTurno)}. Puedes cambiar de ruta o turno arriba.</p>
      <div class="row"><button class="btn primary" data-act="again">Entendido</button></div></div>`;
    return;
  }
  const n = todayCount(u.code), mism = u.ruta && u.ruta !== scanRoute;
  box.innerHTML = `<div class="res ${mism ? 'warn' : 'ok'}"><div class="top2">${avatar(u)}
    <div><div class="rname">${esc(full(u))}</div><div class="rcode">${esc(u.code)}</div><div class="lbl">DNI ${esc(u.dni)}</div></div></div>
    ${me && u.id === me.id ? '<p><b>Este es tu propio carnet de delegado.</b></p>' : ''}
    <p>Ruta del alumno: <b>${esc(u.ruta || 'sin ruta')}</b>. Entregas para la ruta <b>${esc(scanRoute)}</b>, turno <b>${esc(scanTurno)}</b>.</p>
    ${mism ? '<p><b>La ruta no coincide.</b> Confirma con el alumno antes de entregar.</p>' : ''}
    <p class="lbl">${n ? `Hoy recibió ${n} boleto${n > 1 ? 's' : ''}. El sistema permite un boleto por turno.` : 'Hoy todavía no recibió boletos.'}</p>
    <div id="numpick">${numPickHTML()}</div>
    <div class="row"><button class="btn primary" data-act="deliver" data-code="${esc(u.code)}">Entregar boleto</button>
    <button class="btn ghost" data-act="again">Cancelar</button></div></div>`;
}

async function deliver(code){
  const me = cur(), u = DB.users.find(x => (x.role === 'student' || (me && x.id === me.id)) && x.code === code);
  if(!u || !me || delivering) return;
  if(banOf(u.id) || banOf(me.id)){ showResult(); return; }

  const ruta = scanRoute, turno = scanTurno, day = dayKey(Date.now());
  const wanted = Number.isInteger(pickNum) && pickNum >= 1 && pickNum <= LIMIT ? pickNum : null;   // número que eligió el delegado
  // Un usuario puede recibir como máximo un boleto por turno al día.
  const existing = sameTurnTicket(u, turno);
  if(existing){
    pendingCode = null;
    $('#result').innerHTML = `<div class="res warn"><div class="rname">Boleto ya entregado en este turno</div>
      <p>${esc(full(u))} ya tiene el boleto N° ${String(existing.num).padStart(2, '0')} para la ruta ${esc(existing.ruta)}, turno ${esc(turno)}.</p>
      <div class="row"><button class="btn primary" data-act="again">Escanear otro carnet</button></div></div>`;
    return;
  }

  delivering = true;
  let result = null;
  try{
    result = await FB.runTransaction(FB.db, async tx => {
      const claimId = `${day}_${turno}_${u.id}`;
      const claimRef = FB.doc(FB.db, 'ticketClaims', claimId);
      const claimSnap = await tx.get(claimRef);

      // Compatibilidad con reservas antiguas que usaban ruta en el ID.
      const legacyId = `${day}_${ruta}_${turno}_${u.id}`;
      const legacyRef = FB.doc(FB.db, 'ticketClaims', legacyId);
      const legacySnap = legacyId !== claimId ? await tx.get(legacyRef) : null;

      const existingClaim = claimSnap.exists() ? claimSnap.data() : (legacySnap && legacySnap.exists() ? legacySnap.data() : null);
      const existingClaimRef = claimSnap.exists() ? claimRef : (legacySnap && legacySnap.exists() ? legacyRef : null);

      if(existingClaim && existingClaim.ticketId){
        const oldTicketRef = FB.doc(FB.db, 'tickets', existingClaim.ticketId);
        const oldTicketSnap = await tx.get(oldTicketRef);
        if(oldTicketSnap.exists()) return { ticket: { ...oldTicketSnap.data(), id: oldTicketSnap.id }, created: false };
      }

      // Si ya existe el claim canónico pero perdió su boleto, debemos reutilizar
      // exactamente su ticketId: así las Rules permiten reparar el estado huérfano.
      let num = null, ticketRef = null, ticketRuta = ruta;
      if(claimSnap.exists() && existingClaim && existingClaim.ticketId){
        const parts = String(existingClaim.ticketId).split('_');
        const candidateNum = Number(parts[parts.length - 1]);
        if(parts.length >= 4 && Number.isInteger(candidateNum) && candidateNum >= 1 && candidateNum <= LIMIT){
          num = candidateNum;
          ticketRuta = parts.slice(1, -2).join('_') || ruta;
          ticketRef = FB.doc(FB.db, 'tickets', existingClaim.ticketId);
          const check = await tx.get(ticketRef);
          if(check.exists()) return { ticket: { ...check.data(), id: check.id }, created: false };
        }
      }

      // Para una reserva nueva o una reserva antigua (legacy), busca un número
      // libre dentro de la ruta+turno. Todos los candidatos se leen dentro de
      // la transacción para evitar carreras entre dos delegados.
      if(!ticketRef && wanted){
        // El delegado eligió un número concreto: se verifica dentro de la transacción que siga libre.
        const ref = FB.doc(FB.db, 'tickets', `${day}_${ruta}_${turno}_${wanted}`);
        const snap = await tx.get(ref);
        if(snap.exists()) throw new Error('num-taken');
        num = wanted; ticketRef = ref;
      }
      if(!ticketRef){
        for(let n = 1; n <= LIMIT; n++){
          const ref = FB.doc(FB.db, 'tickets', `${day}_${ruta}_${turno}_${n}`);
          const snap = await tx.get(ref);
          if(!snap.exists()){ num = n; ticketRef = ref; break; }
        }
      }
      if(!num || !ticketRef) throw new Error('quota-full');

      const ts = Date.now();
      const ticket = { id: ticketRef.id, num, uid: u.id, code: u.code, name: full(u), ts, day, by: full(me), byUid: me.id, ruta: ticketRuta, turno };
      const claim = { uid: u.id, code: u.code, ticketId: ticketRef.id, day, ruta: ticketRuta, turno, byUid: me.id, ts };

      if(existingClaimRef){
        // Reserva huérfana: se conserva la unicidad y, si era legacy, se migra
        // al formato canónico en la misma transacción.
        tx.set(claimRef, claim);
        if(existingClaimRef.id !== claimRef.id) tx.delete(existingClaimRef);
      }else{
        tx.set(claimRef, claim);
      }
      tx.set(ticketRef, ticket);
      tx.set(FB.doc(FB.db, 'slots', ticketRef.id), { day, ruta: ticketRuta, turno, num });
      return { ticket, created: true };
    });
  }catch(e){
    if(String(e && e.message) === 'quota-full'){
      $('#result').innerHTML = `<div class="res bad"><div class="rname">Límite alcanzado</div><p>Ya se entregaron ${LIMIT} boletos hoy para la ruta ${esc(ruta)} en el turno ${esc(turno)}.</p><div class="row"><button class="btn primary" data-act="again">Entendido</button></div></div>`;
      delivering = false; return;
    }
    if(String(e && e.message) === 'num-taken'){
      pickNum = null;
      const np = $('#numpick'); if(np) np.innerHTML = numPickHTML();
      alert('Ese número de boleto ya fue entregado a otra persona. Elige otro número.');
      delivering = false; return;
    }
    console.error(e);
    fail();
    delivering = false;
    return;
  }finally{
    delivering = false;
  }

  const t = result.ticket;
  DB.tickets = DB.tickets.filter(x => x.id !== t.id);
  DB.tickets.unshift(t);
  pendingCode = null; pickNum = null;
  const q = $('#quota'); if(q) q.innerHTML = quotaHTML();
  $('#result').innerHTML = `<div class="res ${result.created ? 'ok' : 'warn'}"><div class="rname">${result.created ? 'Boleto entregado' : 'Boleto ya entregado'}</div>
    <p>${esc(full(u))} ${result.created ? 'recibió' : 'ya tenía'} el boleto N° ${String(t.num).padStart(2, '0')} para la ruta ${esc(t.ruta)}, turno ${esc(t.turno)}, a las ${hora(t.ts)}.</p>
    <div class="row"><button class="btn primary" data-act="again">Escanear otro carnet</button></div></div>`;
}

async function deleteTicket(id){
  const me = cur(), t = DB.tickets.find(x => x.id === id);
  if(!me || me.role !== 'admin' || !t) return;
  if(!confirm(`¿Eliminar el boleto de ${full(t)}? Esta acción libera el cupo de la ruta y turno.`)) return;
  try{
    const batch = FB.writeBatch(FB.db);
    batch.delete(FB.doc(FB.db, 'tickets', id));
    batch.delete(FB.doc(FB.db, 'slots', id));
    batch.delete(FB.doc(FB.db, 'ticketClaims', ticketClaimId(t)));
    // También limpia el formato antiguo de claim para que no bloquee una nueva entrega.
    batch.delete(FB.doc(FB.db, 'ticketClaims', legacyTicketClaimId(t)));
    await batch.commit();
    DB.tickets = DB.tickets.filter(x => x.id !== id);
    softRender();
  }catch(e){ fail(); }
}
function resume(){
  const box = $('#result'); if(box) box.innerHTML = '';
  const m = $('#manual'); if(m) m.value = '';
  pendingCode = null; paused = false; pickNum = null;
}

/* Service worker: guarda la app en el dispositivo para que abra aunque no haya internet */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(() => navigator.serviceWorker.ready).then(reg => {
      setTimeout(() => {
        const urls = performance.getEntriesByType('resource').map(r => r.name).filter(u => /^https:\/\/(www\.gstatic\.com\/firebasejs|cdn\.jsdelivr\.net|fonts\.googleapis\.com|fonts\.gstatic\.com)\//.test(u));
        const w = reg.active || navigator.serviceWorker.controller; if(w) w.postMessage({ type: 'warm', urls });
      }, 3000);
    }).catch(() => {});
  });
}

init();
</script>
